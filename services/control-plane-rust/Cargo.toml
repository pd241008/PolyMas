[package]
name = "polymas-control-plane"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
tonic-build = "0.11"
