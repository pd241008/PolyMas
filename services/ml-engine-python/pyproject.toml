[project]
name = "polymas-ml-engine"
version = "0.1.0"
description = "Polymas multi-label ensemble ML engine for diabetes risk prediction"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf>=5.27.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "xgboost>=2.0",
    "catboost>=1.2",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "shap>=0.45",
    "lime>=0.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
extend-ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
